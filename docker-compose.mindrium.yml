services:
  mongo:
    image: mongo:7
    container_name: mindrium_mongo
    volumes:
      - mindrium_mongo:/data/db
    restart: unless-stopped

  mindrium-backend:
    build:
      context: ./backend/app
    container_name: mindrium_backend
    depends_on:
      - mongo
    environment:
      - TZ=Asia/Seoul
      - ENV=dev
      - MONGO_URI=mongodb://mongo:27017/
      - DB_NAME=flutter_test
      - JWT_SECRET=dev-secret-change-in-production
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - PLATFORM_BASE_URL=http://platform_public_python:8061
    restart: unless-stopped

volumes:
  mindrium_mongo:
